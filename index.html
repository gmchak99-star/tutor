<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실전영어 AI 코치 & 무한 섀도잉</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --stop-red: #ef4444;
      --green: #10b981;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* 상단 네비게이션 헤더 */
    header {
      flex-shrink: 0;
      height: 48px;
      padding: 0 12px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title { font-size: 0.92rem; font-weight: 800; color: #38bdf8; }
    .header-btns { display: flex; gap: 6px; }
    .btn-top {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-stop-all { background: var(--stop-red); color: white; }
    .btn-dark { background: #334155; color: #cbd5e1; }

    /* 대화 영역 (속도감 최적화) */
    #chat-scroll-area {
      flex: 6;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid #334155;
    }
    .msg-coach { border-left: 4px solid #38bdf8; }
    .msg-user { border-left: 4px solid #10b981; background: #132e2b; }
    .msg-role { 
      font-size: 0.72rem; 
      font-weight: 800; 
      margin-bottom: 4px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .msg-coach .msg-role { color: #38bdf8; }
    .msg-user .msg-role { color: #34d399; }
    .msg-body { font-size: 0.9rem; line-height: 1.4; word-break: keep-all; }
    .grammar-tip {
      margin-top: 6px;
      padding: 6px 8px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #cbd5e1;
      border: 1px dashed #475569;
    }
    .grammar-tip b { color: #fbbf24; }

    .btn-inline-stop {
      background: var(--stop-red);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 하단 섀도잉 집중 훈련소 */
    #loop-vault-section {
      flex: 4;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #090d16;
      border-top: 2px solid #334155;
      padding: 8px 12px;
    }
    .vault-title {
      font-size: 0.76rem;
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .loop-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .loop-en { font-size: 0.88rem; font-weight: 700; color: #38bdf8; }
    .loop-ko { font-size: 0.75rem; color: #94a3b8; margin: 2px 0 6px 0; }
    .loop-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .btn-rep { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 4px 7px; 
      border-radius: 4px; 
      font-size: 0.7rem; 
      font-weight: 700; 
      cursor: pointer; 
    }
    .loop-status { font-size: 0.7rem; color: #10b981; font-weight: 700; margin-left: auto; }

    /* 화면 하단 일체형 입력바 */
    footer {
      flex-shrink: 0;
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 8px));
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .btn-mic {
      width: 42px;
      height: 42px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 1rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .input-box-container {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 2px 4px 2px 10px;
    }
    #user-input {
      flex: 1;
      min-width: 0;
      height: 38px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 0.88rem;
    }
    .btn-send-inside {
      height: 34px;
      padding: 0 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* 초기 오디오 언락 배너 */
    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .btn-start-action {
      background: #2563eb;
      color: white;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 16px 28px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      margin-top: 15px;
    }

    /* 절전 암전 커튼 */
    #dark-curtain {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 99999;
      color: #10b981;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      touch-action: none;
    }
    .dark-num { font-size: 2.4rem; font-weight: 900; color: #22c55e; margin: 15px 0; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 모바일 오디오 잠금 해제 오버레이 -->
  <div id="start-overlay">
    <div style="font-size:1.8rem; margin-bottom:10px;">🎙️</div>
    <h2 style="font-size:1.2rem; color:#38bdf8; margin-bottom:8px;">실전영어 AI 트레이너</h2>
    <p style="font-size:0.85rem; color:#94a3b8; line-height:1.5;">모바일 브라우저의 소리 출력을 위해<br>아래 버튼을 눌러 첫 질문을 들어보세요.</p>
    <button class="btn-start-action" onclick="initFirstGreeting()">🚀 실전 대화 시작하기</button>
  </div>

  <header>
    <div class="header-title">🎙️ 실전영어 AI 코치</div>
    <div class="header-btns">
      <button class="btn-top btn-stop-all" onclick="stopAllSpeech()">⏹️ 정지</button>
      <button class="btn-top btn-dark" onclick="openDarkCurtain()">🌙 화면끄기</button>
    </div>
  </header>

  <div id="chat-scroll-area"></div>

  <div id="loop-vault-section">
    <div class="vault-title">
      <span>🔥 문장 무한 섀도잉 집중 훈련소</span>
      <span style="font-size: 0.7rem; color: #94a3b8;">문장별 정지 완비</span>
    </div>
    <div id="vault-list"></div>
  </div>

  <footer>
    <div class="input-wrapper">
      <button class="btn-mic" id="mic-btn" onclick="handleMicClick()" title="음성 말하기">🎤</button>
      <div class="input-box-container">
        <input type="text" id="user-input" placeholder="영어나 콩글리시로 대답..." onfocus="stopAllSpeech()" onkeypress="if(event.key==='Enter') handleSendClick()">
        <button class="btn-send-inside" onclick="handleSendClick()">전송</button>
      </div>
    </div>
  </footer>
</div>

<div id="dark-curtain" onclick="handleCurtainTap()">
  <div style="font-size: 0.9rem; color: #64748b; padding: 0 20px; text-align: center;" id="dark-sentence">무한 섀도잉 절전 모드</div>
  <div class="dark-num" id="dark-count">0 / 10</div>
  <div style="font-size: 0.8rem; color: #475569; text-align: center;">화면을 빠르게 <b>두 번 톡톡</b> 치면 복귀합니다.</div>
</div>

<script>
  const HARDCODED_API_KEY = "AQ.Ab8RN6LUfJtKLbWlytmxerLEtCkHT4R_F2g3rQMetz0Q414mYQ";

  let isLoopActive = false;
  let loopTimeout = null;
  let currentUtterance = null;
  let lastTapTime = 0;
  let recognition = null;
  let isListening = false;

  // 진동 피드백 유틸리티
  function triggerHaptic(duration = 40) {
    if ("vibrate" in navigator) {
      navigator.vibrate(duration);
    }
  }

  function stopAllSpeech(statusId = null) {
    isLoopActive = false;
    clearTimeout(loopTimeout);
    window.speechSynthesis.cancel();
    if (statusId && document.getElementById(statusId)) {
      document.getElementById(statusId).innerText = "정지됨";
    }
    const darkCnt = document.getElementById('dark-count');
    if (darkCnt) darkCnt.innerText = "정지됨";
  }

  function speakOnce(text, statusId = null) {
    stopAllSpeech();
    window.speechSynthesis.resume();
    const cleanText = text.replace(/freediving/gi, "free diving");
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = 'en-US';
    u.rate = 0.92;
    currentUtterance = u;
    if (statusId && document.getElementById(statusId)) {
      document.getElementById(statusId).innerText = "재생 중";
      u.onend = () => { document.getElementById(statusId).innerText = ""; };
      u.onerror = () => { document.getElementById(statusId).innerText = ""; };
    }
    window.speechSynthesis.speak(u);
  }

  function startLoop(text, maxCount, statusId = null) {
    stopAllSpeech();
    isLoopActive = true;
    let count = 0;
    const cleanText = text.replace(/freediving/gi, "free diving");
    document.getElementById('dark-sentence').innerText = text;

    function loop() {
      if (!isLoopActive || count >= maxCount) {
        if (isLoopActive && statusId && document.getElementById(statusId)) {
          document.getElementById(statusId).innerText = `${maxCount}회 완료`;
        }
        return;
      }
      count++;
      if (statusId && document.getElementById(statusId)) {
        document.getElementById(statusId).innerText = `${count} / ${maxCount}`;
      }
      document.getElementById('dark-count').innerText = `${count} / ${maxCount}`;

      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = 'en-US';
      u.rate = 0.92;
      currentUtterance = u;
      u.onend = () => {
        if (isLoopActive && count < maxCount) {
          loopTimeout = setTimeout(loop, 700);
        } else if (count >= maxCount && statusId && document.getElementById(statusId)) {
          document.getElementById(statusId).innerText = "완료";
        }
      };
      u.onerror = () => { if (isLoopActive) loopTimeout = setTimeout(loop, 400); };
      window.speechSynthesis.speak(u);
    }
    loop();
  }

  function addCoachMessage(htmlContent, speakText = null) {
    const area = document.getElementById('chat-scroll-area');
    const div = document.createElement('div');
    div.className = "msg-card msg-coach";
    const stopBtn = speakText ? `<button class="btn-inline-stop" onclick="stopAllSpeech()">⏹️ 정지</button>` : '';
    div.innerHTML = `
      <div class="msg-role">
        <span>🤖 AI 실전 코치</span>
        <div>${stopBtn}</div>
      </div>
      <div class="msg-body">${htmlContent}</div>
    `;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;

    if (speakText) {
      speakOnce(speakText);
    }
  }

  function addUserMessage(text) {
    const area = document.getElementById('chat-scroll-area');
    const div = document.createElement('div');
    div.className = "msg-card msg-user";
    div.innerHTML = `
      <div class="msg-role"><span>👤 나 (You)</span></div>
      <div class="msg-body">${text}</div>
    `;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function addToVault(en, ko) {
    const list = document.getElementById('vault-list');
    const sid = `st_${Date.now()}`;
    const card = document.createElement('div');
    card.className = "loop-card";
    const cleanEn = en.replace(/'/g, "\\'");
    card.innerHTML = `
      <div class="loop-en">${en}</div>
      <div class="loop-ko">${ko}</div>
      <div class="loop-actions">
        <button class="btn-rep" onclick="speakOnce('${cleanEn}', '${sid}')">1회</button>
        <button class="btn-rep" onclick="startLoop('${cleanEn}', 10, '${sid}')">▶ 10회</button>
        <button class="btn-rep" onclick="startLoop('${cleanEn}', 50, '${sid}')">▶ 50회</button>
        <button class="btn-rep" onclick="startLoop('${cleanEn}', 100, '${sid}')">▶ 100회</button>
        <button class="btn-inline-stop" onclick="stopAllSpeech('${sid}')">⏹️ 정지</button>
        <span class="loop-status" id="${sid}"></span>
      </div>
    `;
    list.prepend(card);
  }

  // 초고속 최적화 API 호출
  async function callGemini(promptText) {
    const systemPrompt = `당신은 실전 영어회화 전문 코치입니다.
사용자 관심사: 헬스, 체지방 감량, 프리다이빙, 펜션 운영, 외국인 손님 응대, 수영.
자연스러운 원어민 구동사(check in, check out, deal with, take care of 등)를 주로 사용하여 핵심만 간결하고 명확하게 피드백하세요.
응답은 반드시 아래 JSON 형식으로만 작성하세요:
{
  "correction": "사용자 발화 교정 문장 (영어)",
  "korean": "교정 문장 한국어 번역",
  "explanation": "핵심 구동사 및 문법 설명 (한국어 1줄)",
  "next_question_en": "다음 대화를 이어갈 영어 질문 1문장",
  "next_question_ko": "다음 영어 질문 한국어 번역"
}`;

    const candidateUrls = [
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${HARDCODED_API_KEY}`,
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${HARDCODED_API_KEY}`
    ];

    let lastError = null;
    for (const url of candidateUrls) {
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              { role: "user", parts: [{ text: systemPrompt + "\n\n사용자 발화: " + promptText }] }
            ]
          })
        });

        if (res.ok) {
          const data = await res.json();
          const raw = data.candidates[0].content.parts[0].text;
          const clean = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
          return JSON.parse(clean);
        } else {
          const errData = await res.json();
          lastError = new Error(errData.error?.message || "호출 실패");
        }
      } catch (e) {
        lastError = e;
      }
    }
    throw lastError || new Error("Gemini API 호출에 실패했습니다.");
  }

  function handleSendClick() {
    triggerHaptic(50);
    sendUserReply();
  }

  async function sendUserReply() {
    stopAllSpeech();
    const inp = document.getElementById('user-input');
    const text = inp.value.trim();
    if (!text) return;

    addUserMessage(text);
    inp.value = "";
    inp.blur();

    addCoachMessage("💡 원어민 표현으로 교정 중입니다...", null);

    try {
      const res = await callGemini(text);
      const chatArea = document.getElementById('chat-scroll-area');
      chatArea.removeChild(chatArea.lastChild);

      const html = `
        <div style="font-weight:700; color:#38bdf8; font-size:1rem; margin-bottom:4px;">✨ ${res.correction}</div>
        <div style="color:#94a3b8; font-size:0.8rem; margin-bottom:6px;">🇰🇷 ${res.korean}</div>
        <div class="grammar-tip"><b>💡 핵심 코칭:</b> ${res.explanation}</div>
        <div style="margin-top:8px; padding-top:6px; border-top:1px solid #334155;">
          <div style="color:#f8fafc; font-weight:600; font-size:0.88rem;">👉 ${res.next_question_en}</div>
          <div style="color:#64748b; font-size:0.75rem;">(${res.next_question_ko})</div>
        </div>
      `;
      addCoachMessage(html, res.next_question_en);
      addToVault(res.correction, res.korean);
    } catch (e) {
      alert("오류 발생: " + e.message);
    }
  }

  function handleMicClick() {
    triggerHaptic(40);
    toggleSTT();
  }

  function toggleSTT() {
    stopAllSpeech();
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert("현재 브라우저는 음성 입력을 지원하지 않습니다. 크롬 또는 웨일 브라우저를 사용해 주세요.");
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!recognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.onstart = () => {
        isListening = true;
        document.getElementById('mic-btn').innerText = "🔴";
        document.getElementById('user-input').placeholder = "듣는 중입니다. 말씀하세요...";
      };
      recognition.onresult = (e) => {
        document.getElementById('user-input').value = e.results[0][0].transcript;
      };
      recognition.onend = () => {
        isListening = false;
        document.getElementById('mic-btn').innerText = "🎤";
        document.getElementById('user-input').placeholder = "영어나 콩글리시로 대답...";
      };
    }
    if (isListening) recognition.stop();
    else recognition.start();
  }

  function openDarkCurtain() {
    document.getElementById('dark-curtain').style.display = 'flex';
  }
  function handleCurtainTap() {
    const now = Date.now();
    if (now - lastTapTime < 350) {
      document.getElementById('dark-curtain').style.display = 'none';
    }
    lastTapTime = now;
  }

  // 모바일 오디오 언락 및 첫 발화 실행
  function initFirstGreeting() {
    triggerHaptic(40);
    document.getElementById('start-overlay').style.display = 'none';
    
    // 첫 질문 텍스트 및 음성 출력
    addCoachMessage(`
      <b>Welcome to Real-English Training!</b><br>
      게스트하우스에 외국인 손님이 방금 도착했습니다.<br>
      <i>"Hi, we’d like to check in, but is it too early?"</i><br>
      방이 준비되었거나 짐을 먼저 맡아주겠다고 편하게 영어로 답해보세요!
    `, "Hi, we would like to check in, but is it too early?");
  }
</script>
</body>
</html>
