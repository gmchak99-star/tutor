<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실전영어 AI 코치 & 무한 섀도잉</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --stop-red: #ef4444;
      --stop-hover: #dc2626;
      --green: #10b981;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 768px;
      margin: 0 auto;
      position: relative;
    }
    /* 상단 네비게이션 헤더 */
    header {
      flex-shrink: 0;
      padding: 10px 14px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }
    .header-title { 
      font-size: 1rem; 
      font-weight: 800; 
      color: #38bdf8; 
      white-space: nowrap; 
    }
    .header-btns { 
      display: flex; 
      gap: 6px; 
      align-items: center; 
    }
    .btn-top {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-stop-all { background: var(--stop-red); color: white; }
    .btn-stop-all:hover { background: var(--stop-hover); }
    .btn-dark { background: #334155; color: #cbd5e1; }
    .btn-dark:hover { background: #475569; }

    /* 대화 스크롤 영역 */
    #chat-scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      border: 1px solid #334155;
    }
    .msg-coach { border-left: 4px solid #38bdf8; }
    .msg-user { border-left: 4px solid #10b981; background: #132e2b; }
    .msg-role { 
      font-size: 0.75rem; 
      font-weight: 800; 
      margin-bottom: 6px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .msg-coach .msg-role { color: #38bdf8; }
    .msg-user .msg-role { color: #34d399; }
    .msg-body { 
      font-size: 0.95rem; 
      line-height: 1.5; 
      word-break: keep-all; 
    }
    
    .grammar-tip {
      margin-top: 10px;
      padding: 8px 10px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
      border: 1px dashed #475569;
    }
    .grammar-tip b { color: #fbbf24; }

    /* 개별 문장 정지 버튼 */
    .btn-inline-stop {
      background: var(--stop-red);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .btn-inline-stop:hover { background: var(--stop-hover); }

    /* 하단 무한 섀도잉 카드 보관소 */
    #loop-vault-section {
      flex-shrink: 0;
      max-height: 38%;
      overflow-y: auto;
      background: #090d16;
      border-top: 2px solid #334155;
      padding: 10px 12px;
    }
    .vault-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      align-items: center;
    }
    .loop-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .loop-en { font-size: 0.95rem; font-weight: 700; color: #38bdf8; }
    .loop-ko { font-size: 0.8rem; color: #94a3b8; margin: 3px 0 6px 0; }
    .loop-actions { 
      display: flex; 
      gap: 5px; 
      align-items: center; 
      flex-wrap: wrap; 
    }
    .btn-rep { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 5px 8px; 
      border-radius: 4px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      cursor: pointer; 
    }
    .btn-rep:hover { background: var(--accent-hover); }
    .loop-status { 
      font-size: 0.75rem; 
      color: #10b981; 
      font-weight: 700; 
      margin-left: auto; 
    }

    /* 하단 입력바 (모바일 하단 홈바 safe-area 최적화) */
    footer {
      flex-shrink: 0;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: #1e293b;
      border-top: 1px solid #334155;
    }
    .input-bar {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #user-input {
      flex: 1;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: white;
      font-size: 0.95rem;
    }
    #user-input:focus { outline: 2px solid var(--accent); }
    .btn-send { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 10px 14px; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 0.9rem; 
      cursor: pointer; 
    }
    .btn-send:hover { background: var(--accent-hover); }
    .btn-mic { 
      background: #334155; 
      color: white; 
      border: 1px solid #475569; 
      padding: 10px 12px; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      cursor: pointer; 
    }

    /* OLED 절전 암전 모드 커튼 */
    #dark-curtain {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 99999;
      color: #10b981;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      touch-action: none;
    }
    .dark-num { font-size: 2.4rem; font-weight: 900; color: #22c55e; margin: 15px 0; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 상단바 -->
  <header>
    <div class="header-title">🎙️ 실전영어 AI 코치</div>
    <div class="header-btns">
      <button class="btn-top btn-stop-all" onclick="stopAllSpeech()">⏹️ 긴급정지</button>
      <button class="btn-top btn-dark" onclick="openDarkCurtain()">🌙 화면끄기</button>
    </div>
  </header>

  <!-- 실시간 대화창 -->
  <div id="chat-scroll-area"></div>

  <!-- 무한 섀도잉 보관소 -->
  <div id="loop-vault-section">
    <div class="vault-title">
      <span>🔥 문장 무한 섀도잉 집중 훈련소</span>
      <span style="font-size: 0.72rem; color: #94a3b8;">개별 정지 완비</span>
    </div>
    <div id="vault-list"></div>
  </div>

  <!-- 하단 입력창 -->
  <footer>
    <div class="input-bar">
      <button class="btn-mic" id="mic-btn" onclick="toggleSTT()" title="음성 말하기">🎤</button>
      <input type="text" id="user-input" placeholder="영어나 콩글리시로 대답해 보세요..." onfocus="stopAllSpeech()" onkeypress="if(event.key==='Enter') sendUserReply()">
      <button class="btn-send" onclick="sendUserReply()">전송</button>
    </div>
  </footer>
</div>

<!-- 화면 절전 커튼 -->
<div id="dark-curtain" onclick="handleCurtainTap()">
  <div style="font-size: 0.9rem; color: #64748b; padding: 0 20px; text-align: center;" id="dark-sentence">무한 섀도잉 절전 모드</div>
  <div class="dark-num" id="dark-count">0 / 10</div>
  <div style="font-size: 0.8rem; color: #475569; text-align: center;">화면을 빠르게 <b>두 번 톡톡</b> 치면 복귀합니다.</div>
</div>

<script>
  /* ========================================================
     [Gemini API 키 자동 연동 완료]
     제공해주신 API 키가 고정 삽입되어 더 이상 팝업이 뜨지 않습니다.
  ======================================================== */
  const HARDCODED_API_KEY = "AQ.Ab8RN6LUfJtKLbWlytmxerLEtCkHT4R_F2g3rQMetz0Q414mYQ";

  let isLoopActive = false;
  let loopTimeout = null;
  let currentUtterance = null;
  let lastTapTime = 0;
  let recognition = null;
  let isListening = false;

  // 전체 음성 즉시 정지
  function stopAllSpeech(statusId = null) {
    isLoopActive = false;
    clearTimeout(loopTimeout);
    window.speechSynthesis.cancel();
    if (statusId && document.getElementById(statusId)) {
      document.getElementById(statusId).innerText = "정지됨";
    }
    const darkCnt = document.getElementById('dark-count');
    if (darkCnt) darkCnt.innerText = "정지됨";
  }

  // 1회 단독 재생 (또렷한 0.88x 템포)
  function speakOnce(text, statusId = null) {
    stopAllSpeech();
    const cleanText = text.replace(/freediving/gi, "free diving");
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = 'en-US';
    u.rate = 0.88;
    currentUtterance = u;
    if (statusId && document.getElementById(statusId)) {
      document.getElementById(statusId).innerText = "재생 중";
      u.onend = () => { document.getElementById(statusId).innerText = ""; };
      u.onerror = () => { document.getElementById(statusId).innerText = ""; };
    }
    window.speechSynthesis.speak(u);
  }

  // 무한 반복 섀도잉 루프
  function startLoop(text, maxCount, statusId = null) {
    stopAllSpeech();
    isLoopActive = true;
    let count = 0;
    const cleanText = text.replace(/freediving/gi, "free diving");
    document.getElementById('dark-sentence').innerText = text;

    function loop() {
      if (!isLoopActive || count >= maxCount) {
        if (isLoopActive && statusId && document.getElementById(statusId)) {
          document.getElementById(statusId).innerText = `${maxCount}회 완료`;
        }
        return;
      }
      count++;
      if (statusId && document.getElementById(statusId)) {
        document.getElementById(statusId).innerText = `${count} / ${maxCount}`;
      }
      document.getElementById('dark-count').innerText = `${count} / ${maxCount}`;

      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = 'en-US';
      u.rate = 0.88;
      currentUtterance = u;
      u.onend = () => {
        if (isLoopActive && count < maxCount) {
          loopTimeout = setTimeout(loop, 800); // 0.8초 섀도잉 정적
        } else if (count >= maxCount && statusId && document.getElementById(statusId)) {
          document.getElementById(statusId).innerText = "완료";
        }
      };
      u.onerror = () => { if (isLoopActive) loopTimeout = setTimeout(loop, 500); };
      window.speechSynthesis.speak(u);
    }
    loop();
  }

  // AI 코치 메시지 렌더링 (각 말풍선마다 전용 정지 버튼 배치)
  function addCoachMessage(htmlContent, speakText = null) {
    const area = document.getElementById('chat-scroll-area');
    const div = document.createElement('div');
    div.className = "msg-card msg-coach";
    const stopBtn = speakText ? `<button class="btn-inline-stop" onclick="stopAllSpeech()">⏹️ 정지</button>` : '';
    div.innerHTML = `
      <div class="msg-role">
        <span>🤖 AI 실전 코치</span>
        <div>${stopBtn}</div>
      </div>
      <div class="msg-body">${htmlContent}</div>
    `;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;

    if (speakText) {
      speakOnce(speakText);
    }
  }

  // 사용자 메시지 렌더링
  function addUserMessage(text) {
    const area = document.getElementById('chat-scroll-area');
    const div = document.createElement('div');
    div.className = "msg-card msg-user";
    div.innerHTML = `
      <div class="msg-role"><span>👤 나 (You)</span></div>
      <div class="msg-body">${text}</div>
    `;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  // 섀도잉 훈련소 카드 추가 (문장별 정지 버튼 포함)
  function addToVault(en, ko) {
    const list = document.getElementById('vault-list');
    const sid = `st_${Date.now()}`;
    const card = document.createElement('div');
    card.className = "loop-card";
    const cleanEn = en.replace(/'/g, "\\'");
    card.innerHTML = `
      <div class="loop-en">${en}</div>
      <div class="loop-ko">${ko}</div>
      <div class="loop-actions">
        <button class="btn-rep" onclick="speakOnce('${cleanEn}', '${sid}')">1회</button>
        <button class="btn-rep" onclick="startLoop('${cleanEn}', 10, '${sid}')">▶ 10회</button>
        <button class="btn-rep" onclick="startLoop('${cleanEn}', 50, '${sid}')">▶ 50회</button>
        <button class="btn-rep" onclick="startLoop('${cleanEn}', 100, '${sid}')">▶ 100회</button>
        <button class="btn-inline-stop" onclick="stopAllSpeech('${sid}')">⏹️ 정지</button>
        <span class="loop-status" id="${sid}"></span>
      </div>
    `;
    list.prepend(card);
  }

  // Gemini API 통신 파이프라인
  async function callGemini(promptText) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${HARDCODED_API_KEY}`;
    const systemPrompt = `당신은 실전 영어회화 전문 코치입니다.
사용자 관심사: 헬스, 체지방 감량, 프리다이빙, 펜션 운영, 외국인 손님 응대, 수영.
자연스러운 원어민 구동사(check in, check out, deal with, take care of 등)를 주로 사용하여 피드백하세요.
응답은 반드시 아래 JSON 형식으로만 작성하세요:
{
  "correction": "사용자 발화 교정 문장 (영어)",
  "korean": "교정 문장의 자연스러운 한국어 번역",
  "explanation": "핵심 구동사 및 문법 설명 (한국어 1~2줄)",
  "next_question_en": "다음 대화를 이어갈 영어 질문 1문장",
  "next_question_ko": "다음 영어 질문의 한국어 번역"
}`;

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [
          { role: "user", parts: [{ text: systemPrompt + "\n\n사용자 발화: " + promptText }] }
        ]
      })
    });
    
    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.error?.message || "Gemini API 호출에 실패했습니다.");
    }

    const data = await res.json();
    const raw = data.candidates[0].content.parts[0].text;
    const clean = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
    return JSON.parse(clean);
  }

  // 사용자 메시지 전송 및 교정 처리
  async function sendUserReply() {
    stopAllSpeech();
    const inp = document.getElementById('user-input');
    const text = inp.value.trim();
    if (!text) return;

    addUserMessage(text);
    inp.value = "";
    inp.blur();

    addCoachMessage("💡 원어민 표현으로 교정 중입니다...", null);

    try {
      const res = await callGemini(text);
      const chatArea = document.getElementById('chat-scroll-area');
      chatArea.removeChild(chatArea.lastChild); // 대기 메시지 제거

      const html = `
        <div style="font-weight:700; color:#38bdf8; font-size:1.05rem; margin-bottom:4px;">✨ ${res.correction}</div>
        <div style="color:#94a3b8; font-size:0.85rem; margin-bottom:8px;">🇰🇷 ${res.korean}</div>
        <div class="grammar-tip"><b>💡 핵심 코칭:</b> ${res.explanation}</div>
        <div style="margin-top:10px; padding-top:8px; border-top:1px solid #334155;">
          <div style="color:#f8fafc; font-weight:600;">👉 ${res.next_question_en}</div>
          <div style="color:#64748b; font-size:0.8rem;">(${res.next_question_ko})</div>
        </div>
      `;
      addCoachMessage(html, res.next_question_en);
      addToVault(res.correction, res.korean);
    } catch (e) {
      alert("오류 발생: " + e.message);
    }
  }

  // STT 음성 마이크 (말하기)
  function toggleSTT() {
    stopAllSpeech();
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert("현재 브라우저는 음성 입력을 지원하지 않습니다. 크롬 또는 웨일 브라우저를 사용해 주세요.");
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!recognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.onstart = () => {
        isListening = true;
        document.getElementById('mic-btn').innerText = "🔴";
        document.getElementById('user-input').placeholder = "듣는 중입니다. 편하게 말씀하세요...";
      };
      recognition.onresult = (e) => {
        document.getElementById('user-input').value = e.results[0][0].transcript;
      };
      recognition.onend = () => {
        isListening = false;
        document.getElementById('mic-btn').innerText = "🎤";
        document.getElementById('user-input').placeholder = "영어나 콩글리시로 대답해 보세요...";
      };
    }
    if (isListening) recognition.stop();
    else recognition.start();
  }

  // OLED 절전 모드 (더블탭 시 해제)
  function openDarkCurtain() {
    document.getElementById('dark-curtain').style.display = 'flex';
  }
  function handleCurtainTap() {
    const now = Date.now();
    if (now - lastTapTime < 350) {
      document.getElementById('dark-curtain').style.display = 'none';
    }
    lastTapTime = now;
  }

  // 초기 시작 화면 (게스트하우스 첫 손님 응대 상황)
  window.onload = () => {
    addCoachMessage(`
      <b>Welcome to Real-English Training!</b><br>
      게스트하우스에 외국인 손님이 방금 도착했습니다.<br>
      <i>"Hi, we’d like to check in, but is it too early?"</i><br>
      방이 준비되었거나 짐을 먼저 맡아주겠다고 편하게 영어로 답해보세요!
    `, "Hi, we would like to check in, but is it too early?");
  };
</script>
</body>
</html>
